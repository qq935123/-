<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&family=Noto+Sans+TC&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>艾比計算器</title>

<style>
body{
  font-family: "Zen Maru Gothic", "Noto Sans TC", sans-serif;
  text-align:center;
  background:white;
}

.box{
  background:#B0E0E6;
  padding:20px;
  margin:20px auto;
  width:400px;
  border-radius:15px;
  box-shadow:0 0 10px rgba(0,0,0,0.2);
}

/* 一行排版 */
.row{
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-top: 15px;
  flex-wrap: wrap;
}

.result{
  font-weight: bold;
  font-size: 18px;
  margin-left: 10px;
  color:#d35400;
}

input{
  width: 70px;
  text-align: center;
  padding:5px;
}

/* placeholder 樣式 */
::placeholder{
  color:#888;
  font-size:12px;
}
</style>
</head>

<body>

<div class="box">
  <h2>艾比傷害計算</h2>

  <!-- 物傷 -->
  <div class="row">
    物傷：
    <input type="number" id="atk" placeholder="我方物攻">
    <input type="number" id="def" placeholder="對方物防">
    <span class="result" id="pResult">= 0</span>
  </div>

  <!-- 法傷 -->
  <div class="row">
    法傷：
    <input type="number" id="matk" placeholder="我方法攻">
    <input type="number" id="mdef" placeholder="對方法防">
    <span class="result" id="mResult">= 0</span>
  </div>

</div>

<script>
function calculate(){

  let atk = parseFloat(document.getElementById("atk").value) || 0;
  let def = parseFloat(document.getElementById("def").value) || 0;

  let matk = parseFloat(document.getElementById("matk").value) || 0;
  let mdef = parseFloat(document.getElementById("mdef").value) || 0;

  // 物傷
  let physical = atk * (1 - (def / (def + 100)));

  // 法傷
  let magic = matk * 0.6 * (1 - (mdef / (mdef + 100)));

  document.getElementById("pResult").innerText = "= " + physical.toFixed(2);
  document.getElementById("mResult").innerText = "= " + magic.toFixed(2);
}

// 即時計算
document.querySelectorAll("input").forEach(e=>{
  e.addEventListener("input", calculate);
});

calculate();
</script>

</body>
</html>
