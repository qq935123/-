<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&family=Noto+Sans+TC&display=swap" rel="stylesheet">

<title>🦋艾比資質計算🪽</title>

<style>
body{
  font-family: "Zen Maru Gothic", "Noto Sans TC", sans-serif;
  text-align:center;
  margin:0;
  overflow-x:hidden;
  background:#E1FFD4;
}

/* 你的舊框框 */
.box{
  background:#B0E0E6;
  padding:20px;
  margin:20px auto;
  width:95%;          /* 🔥 改這裡 */
  max-width:460px;    /* 電腦維持原本大小 */
  border-radius:15px;
  box-shadow:0 0 10px rgba(0,0,0,0.2);
}
.calc-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  flex-wrap:nowrap;
}
.calc-row input{
  width:18%;
  min-width:50px;
  padding:6px;
  border-radius:10px;
  border:1px solid #ccc;
 font-size:16px;
}

select{
  max-width:120px; /* 防止選單太寬 */
}

#result2{
  font-weight:bold;
  color:#d35400;
  min-width:60px;
}
.note{
  background:#ffffff;
  margin-top:20px;
  padding:15px;
  border-radius:10px;
  text-align:left;
  font-size:14px;
  line-height:1.6;
}

.note h3{
  margin-top:0;
  text-align:center;
}
.stat{
  margin:20px 0;
}

.label{
  margin-bottom:5px;
}

/* 能量條區 */
.bar-wrapper{
  width:100%;
  margin:auto;
  position:relative;
}

.energy-bg{
  width:100%;
  height:20px;
  background:#ddd;
  border-radius:5px;
  overflow:hidden;
}

.energy{
  height:100%;
  width:0%;
  transition:0.2s;
}

/* 格子 */
.grid{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:20px;
  display:flex;
}

.cell{
  flex:1;
  border-right:1px solid rgba(0,0,0,0.2);
  cursor:pointer;
}

/* 按鈕（用你舊風格） */
button{
  margin:5px;
  padding:8px;
  border-radius:10px;
  border:none;
  font-family: inherit;
  font-size:14px;
  min-width:70px;
}

#total{
  font-size:28px;
  color:#d35400;
}
</style>
</head>

<body>

<div class="box">
  <h2 class="title">🦋艾比資質計算🪽</h2>
  <h1>資質：<span id="total">0</span></h1>
  <div id="container"></div>

 <div class="note">
    <h3>補充說明</h3>
    <p>1. 生命、物攻一格資質 +0.625</p>
    <p>2. 法攻、法防、物防一格資質 +1.25</p>
    <p>3. 每個艾比可用 6 個資質果</p>
    <p>4. 第19、20格需使用「至臻果」</p>
    <p>5. 每項資質有20個格</p>
    <p>6. 下方有資質格數計算器可利用</p>

    <p>提示：資質未達82無法餵到彩光</p>
    <p>　　　資質達83以上必能餵出彩光</p>
    <p>　　　資質達86以上能隨便餵:P</p>
  </div>

  </div>

<div class="box">

  <h3>資質格數計算器</h3>

  <div class="calc-row">
    <input id="now" type="number" placeholder="目前數值">
    <input id="step" type="number" placeholder="一格增加數值">
    <input id="max" type="number" placeholder="最大數值">

    <span>=</span>

    <span id="result2">0 格</span>
  </div>

</div>
<div id="author">製作by緣風</div>
<script>
const stats = [
  {name:"生命", value:0, weight:0.625},
  {name:"物攻", value:0, weight:0.625},
  {name:"法攻", value:0, weight:1.25},
  {name:"法防", value:0, weight:1.25},
  {name:"物防", value:0, weight:1.25}
];

const container = document.getElementById("container");

stats.forEach(stat=>{
  let div = document.createElement("div");
  div.className="stat";

  let label = document.createElement("div");
  label.className="label";

  let wrapper = document.createElement("div");
  wrapper.className="bar-wrapper";

  let bg = document.createElement("div");
  bg.className="energy-bg";

  let energy = document.createElement("div");
  energy.className="energy";

  let grid = document.createElement("div");
  grid.className="grid";

  for(let i=0;i<20;i++){
    let cell = document.createElement("div");
    cell.className="cell";

    cell.onclick = ()=>{
      stat.value = i+1;
      update();
    };

    grid.appendChild(cell);
  }

  bg.appendChild(energy);
  wrapper.appendChild(bg);
  wrapper.appendChild(grid);

  let controls = document.createElement("div");

  let minus = document.createElement("button");
  minus.innerText="-";
  minus.onclick = ()=>{
    if(stat.value>0){
      stat.value--;
      update();
    }
  };

  let plus = document.createElement("button");
  plus.innerText="+";
  plus.onclick = ()=>{
    if(stat.value<20){
      stat.value++;
      update();
    }
  };

  controls.appendChild(minus);
  controls.appendChild(plus);

  div.appendChild(label);
  div.appendChild(wrapper);
  div.appendChild(controls);

  container.appendChild(div);

  stat.label = label;
  stat.energy = energy;
});

function update(){
  let total = 0;

  stats.forEach(stat=>{
    stat.label.innerText = stat.name + "：" + stat.value;

    let percent = (stat.value / 20) * 100;
    stat.energy.style.width = percent + "%";

    if(stat.value <= 17){
      stat.energy.style.background = "#3399ff";
    }
    else if(stat.value === 18){
      stat.energy.style.background = "#cc66ff";
    }
    else{
      stat.energy.style.background =
        "linear-gradient(to right, purple, blue, cyan, lime, yellow, orange)";
    }

    total += stat.value * stat.weight;
  });

  document.getElementById("total").innerText = total.toFixed(2);
}

update();

const now = document.getElementById("now");
const step = document.getElementById("step");
const max = document.getElementById("max");
const result2 = document.getElementById("result2");

[now, step, max].forEach(input=>{
  input.addEventListener("input", calcGrid);
});

function calcGrid(){
  let n = parseFloat(now.value);
  let s = parseFloat(step.value);
  let m = parseFloat(max.value);

  if(isNaN(n) || isNaN(s) || isNaN(m) || s === 0){
    result2.innerText = "0 格";
    return;
  }

  let grid = 20 - ((m - n) / s);

  // 四捨五入
  grid = Math.round(grid);

  result2.innerText = grid + " 格";
}
</script>

</body>
</html>
