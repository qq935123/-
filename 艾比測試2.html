<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&family=Noto+Sans+TC&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>艾比計算器</title>

<style>
body{
  font-family: "Zen Maru Gothic", "Noto Sans TC", sans-serif;
  text-align:center;
}

.box{
  background:#B0E0E6;
  padding:20px;
  margin:20px auto;
  width:460px;
  border-radius:15px;
}

.row{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:10px;
  flex-wrap:nowrap;
}

input, select{
  width:80px;
  text-align:center;
  font-size:12px;
}

/* 異色按鈕 */
.shiny-btn{
  padding:5px 10px;
  border-radius:10px;
  border:none;
  background:#eee;
  cursor:pointer;
  transition:0.2s;
}

.shiny-btn.active{
  background:#ffd700;
  box-shadow:
    0 0 5px #fff,
    0 0 10px #ffe066,
    0 0 20px #ffd770;
  transform:scale(1.2);
}

.result{
  margin-top:10px;
  font-weight:bold;
  color:#d35400;
}

button.calc{
  margin-top:10px;
  padding:8px 20px;
  border:none;
  border-radius:10px;
  background:#4CAF50;
  color:white;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- 🔥 傷害計算回來了 -->
<div class="box">
  <h3>傷害計算</h3>

 <div class="row">
    物傷：
    <input id="atk" placeholder="我方物攻">
    <input id="def" placeholder="對方物防">
    <span id="pResult">=0</span>
  </div>

  <div class="row">
    法傷：
    <input id="matk" placeholder="我方法攻">
    <input id="mdef" placeholder="對方法防">
    <span id="mResult">=0</span>
  </div>

</div>

<div class="box">
  <h3>艾比滿數值計算</h3>

  <!-- 第1行 -->
  <div class="row">
    <input id="level" placeholder="等級">

    <select id="personality">
      <option value="normal">穩健</option>
      <option value="atk_up_def_down">大膽</option>
      <option value="atk_up_matk_down">蠻幹</option>
      <option value="atk_up_mdef_down">愛冒險</option>
      <option value="matk_up_atk_down">機靈</option>
      <option value="matk_up_def_down">急躁</option>
      <option value="matk_up_mdef_down">有衝勁</option>
      <option value="def_up_atk_down">堅定</option>
      <option value="def_up_matk_down">踏實</option>
      <option value="def_up_mdef_down">樂天</option>
      <option value="mdef_up_atk_down">悠閒</option>
      <option value="mdef_up_matk_down">安靜</option>
      <option value="mdef_up_def_down">呆萌</option>
    </select>

    <button id="shinyBtn" class="shiny-btn">異色</button>
  </div>

  <!-- 第2行 -->
  <div class="row">
    <input id="hpA" placeholder="血量資質">
    <input id="atkA" placeholder="物攻資質">
    <input id="matkA" placeholder="法攻資質">
    <input id="defA" placeholder="物防資質">
    <input id="mdefA" placeholder="法防資質">
  </div>

  <!-- 第3行 -->
  <div class="row">
    <input id="hpB" placeholder="基礎血量">
    <input id="atkB" placeholder="基礎物攻">
    <input id="matkB" placeholder="基礎法攻">
    <input id="defB" placeholder="基礎物防">
    <input id="mdefB" placeholder="基礎法防">
  </div>

  <button class="calc" onclick="calculate()">計算</button>

  <div class="result" id="result">
    HP:0 攻:0 法:0 防:0 法防:0
  </div>

  <div id="history">歷史紀錄：</div>
  </div>

<div class="box">
  <h3>艾比基礎數值計算</h3>

  <!-- 第1行 -->
  <div class="row">
    <input id="r_level" placeholder="等級">

    <select id="r_personality">
      <option value="normal">穩健</option>
      <option value="atk_up_def_down">大膽</option>
      <option value="atk_up_matk_down">蠻幹</option>
      <option value="atk_up_mdef_down">愛冒險</option>
      <option value="matk_up_atk_down">機靈</option>
      <option value="matk_up_def_down">急躁</option>
      <option value="matk_up_mdef_down">有衝勁</option>
      <option value="def_up_atk_down">堅定</option>
      <option value="def_up_matk_down">踏實</option>
      <option value="def_up_mdef_down">樂天</option>
      <option value="mdef_up_atk_down">悠閒</option>
      <option value="mdef_up_matk_down">安靜</option>
      <option value="mdef_up_def_down">呆萌</option>
    </select>

    <button id="r_shinyBtn" class="shiny-btn">異色</button>
  </div>

  <!-- 第2行 -->
  <div class="row">
    <input id="r_hpA" placeholder="血量資質">
    <input id="r_atkA" placeholder="物攻資質">
    <input id="r_matkA" placeholder="法攻資質">
    <input id="r_defA" placeholder="物防資質">
    <input id="r_mdefA" placeholder="法防資質">
  </div>

  <!-- 第3行 -->
  <div class="row">
    <input id="val_hp" placeholder="艾比血量">
    <input id="val_atk" placeholder="艾比物攻">
    <input id="val_matk" placeholder="艾比法攻">
    <input id="val_def" placeholder="艾比物防">
    <input id="val_mdef" placeholder="艾比法防">
  </div>

  <button class="calc" onclick="reverseCalc()">計算</button>

  <div class="result" id="reverseResult">
    基礎 HP:0 攻:0 法:0 防:0 法防:0
  </div>

<div id="reverseHistory">歷史紀錄：</div>
</div>

<script>
let shiny = false;

shinyBtn.onclick = function(){
  shiny = !shiny;
  this.classList.toggle("active");
};

/* 🔥 傷害即時計算 */
function calcDamage(){
  let atk = +atkInput.value || 0;
  let def = +defInput.value || 0;
  let matk = +matkInput.value || 0;
  let mdef = +mdefInput.value || 0;

  pResult.innerText = "=" + (atk * (1 - def/(def+100))).toFixed(1);
  mResult.innerText = "=" + (matk * 0.6 * (1 - mdef/(mdef+100))).toFixed(1);
}

document.querySelectorAll("#atk,#def,#matk,#mdef").forEach(e=>{
  e.addEventListener("input", calcDamage);
});

function calcStat(base, apt, lv){
  if(lv <= 30){
    return base + apt * lv;
  }else{
    return base + apt * lv + apt * (lv - 30);
  }
}

function applyPersonality(stats){
  let p = personality.value;
  let up = shiny ? 1.12 : 1.10;
  let down = shiny ? 0.88 : 0.90;

  function mod(stat, type){
    if(p.startsWith(type + "_up")) return stat * up;
    if(p.endsWith(type + "_down")) return stat * down;
    return stat;
  }

  return {
    hp: stats.hp,
    atk: mod(stats.atk,"atk"),
    matk: mod(stats.matk,"matk"),
    def: mod(stats.def,"def"),
    mdef: mod(stats.mdef,"mdef")
  };
}

function calculate(){
  let lv = +level.value || 0;

  let stats = {
    hp: calcStat(+hpB.value||0, +hpA.value||0, lv),
    atk: calcStat(+atkB.value||0, +atkA.value||0, lv),
    matk: calcStat(+matkB.value||0, +matkA.value||0, lv),
    def: calcStat(+defB.value||0, +defA.value||0, lv),
    mdef: calcStat(+mdefB.value||0, +mdefA.value||0, lv)
  };

  let f = applyPersonality(stats);

  let text = `Lv${lv} HP:${Math.round(f.hp)} 攻:${Math.round(f.atk)} 法:${Math.round(f.matk)} 防:${Math.round(f.def)} 法防:${Math.round(f.mdef)}`;

  // ✅ 正確抓 DOM（重點）
  const resultEl = document.getElementById("result");
  const historyEl = document.getElementById("history");

  resultEl.innerText = text;

  let h = JSON.parse(localStorage.getItem("abbyHistory") || "[]");
  h.unshift(text);
  h = h.slice(0, 3);

  localStorage.setItem("abbyHistory", JSON.stringify(h));

  historyEl.innerHTML = "歷史紀錄：<br>" + h.join("<br>");
}

history.innerHTML = "歷史紀錄：<br>" + (JSON.parse(localStorage.getItem("abbyHistory")||"[]")).join("<br>");

let r_shiny = false;

r_shinyBtn.onclick = function(){
  r_shiny = !r_shiny;
  this.classList.toggle("active");
};

function reverseCalc(){
  let lv = +r_level.value || 0;

  let stats = {
    hp: +val_hp.value || 0,
    atk: +val_atk.value || 0,
    matk: +val_matk.value || 0,
    def: +val_def.value || 0,
    mdef: +val_mdef.value || 0
  };

  let p = r_personality.value;
  let up = r_shiny ? 1.12 : 1.10;
  let down = r_shiny ? 0.88 : 0.90;

  const map = {
    atk: ["atk_up_def_down","atk_up_matk_down","atk_up_mdef_down"],
    matk: ["matk_up_atk_down","matk_up_def_down","matk_up_mdef_down"],
    def: ["def_up_atk_down","def_up_matk_down","def_up_mdef_down"],
    mdef:["mdef_up_atk_down","mdef_up_matk_down","mdef_up_def_down"]
  };

  function mod(stat, type){
    if(map[type].includes(p)){
      if(p.includes(type+"_up")) return stat * up;
      if(p.includes(type+"_down")) return stat * down;
    }
    return stat;
  }

  return {
    hp: stats.hp,
    atk: mod(stats.atk,"atk"),
    matk: mod(stats.matk,"matk"),
    def: mod(stats.def,"def"),
    mdef: mod(stats.mdef,"mdef")
  };
}

  function removeBonus(stat, type){
    if(p.includes(type+"_up")) return stat / up;
    if(p.includes(type+"_down")) return stat / down;
    return stat;
  }

  let base = {};

  ["hp","atk","matk","def","mdef"].forEach(s=>{
    let val = removeBonus(stats[s], s);
    let apt = +document.getElementById("r_"+s+"A").value || 0;

    if(lv <= 30){
      base[s] = val - apt * lv;
    }else{
      base[s] = val - apt * lv - apt * (lv - 30);
    }
  });

  let text =
    `基礎 HP:${base.hp.toFixed(1)} 攻:${base.atk.toFixed(1)} 法:${base.matk.toFixed(1)} 防:${base.def.toFixed(1)} 法防:${base.mdef.toFixed(1)}`;

  // 顯示結果
  reverseResult.innerText = text;

  // ====== 🔥 新增：歷史紀錄 ======
  const el = document.getElementById("reverseHistory");

  let h = JSON.parse(localStorage.getItem("abbyReverseHistory") || "[]");

  h.unshift(text);
  h = h.slice(0, 3);

  localStorage.setItem("abbyReverseHistory", JSON.stringify(h));

  el.innerHTML = "歷史紀錄：<br>" + h.join("<br>");
}
</script>

</body>
</html>
